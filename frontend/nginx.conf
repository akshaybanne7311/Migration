server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # React Router (BrowserRouter) client-side routes -- always fall back
    # to index.html so a direct load of e.g. /smart-migration doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend service (named "backend" on
    # the docker-compose network). The frontend build never hardcodes a
    # backend host -- it always calls same-origin /api/..., exactly like
    # the Vite dev server's proxy does locally, so this is a drop-in swap.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512M;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
