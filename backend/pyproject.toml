[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "f5-config-intelligence-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn[standard]==0.39.0",
    "gunicorn==23.0.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.11.0",
    "python-multipart==0.0.20",
    "networkx==3.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
