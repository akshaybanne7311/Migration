#TMSH-VERSION: 17.1.0
# Synthetic bigip.conf fixture for F5 Config Intelligence backend tests.
# Intentionally exercises: IPv4 + IPv6 VIPs, an IPv6 destination with a
# route domain, vlans-enabled vs vlans-disabled, a pool-optional VIP, a
# node shared across two pools/VIPs, an IPv6-only member pool, an orphan
# pool member with no explicit ltm node object, and a VLAN referenced by
# a VIP with no local net vlan object (externally-managed F5OS case).

ltm node /Common/MNP-Node-1 {
    address 2405:200:642:a699:22:0:25:1
    state user-up
}
ltm node /Common/MNP-Node-2 {
    address 2405:200:642:a699:22:0:25:2
    state user-up
}
ltm node /Common/MNP-Node-3 {
    address 2405:200:642:a699:22:0:25:3
    state user-up
}
ltm node /Common/MNP-Node-4 {
    address 2405:200:642:a699:22:0:25:4
    state user-up
}
ltm node /Common/MNP-Node-5 {
    address 2405:200:642:a699:22:0:25:5
    state user-up
}
ltm node /Common/WEB-Node-1 {
    address 10.20.30.11
    state user-up
}
ltm node /Common/WEB-Node-2 {
    address 10.20.30.12
    state user-up
}

ltm monitor udp /Common/MNP-SIP-Monitor {
    interval 5
    timeout 16
}
ltm monitor http /Common/WEB-HTTP-Monitor {
    interval 5
    timeout 16
}

net vlan /Common/MNP-VLAN-1699 {
    tag 1699
    interfaces {
        1.3 { }
    }
}
net vlan /Common/WEB-VLAN-200 {
    tag 200
    interfaces {
        1.1 { }
    }
}

ltm pool /Common/TEST_POOL-JIO-MNP-BL-SIP-5060-IPv6 {
    monitor /Common/MNP-SIP-Monitor
    members {
        /Common/MNP-Node-1:5060 {
            address 2405:200:642:a699:22:0:25:1
            session monitor-enabled
        }
        /Common/MNP-Node-2:5060 {
            address 2405:200:642:a699:22:0:25:2
            session monitor-enabled
        }
        /Common/MNP-Node-3:5060 {
            address 2405:200:642:a699:22:0:25:3
            session monitor-enabled
        }
        /Common/MNP-Node-4:5060 {
            address 2405:200:642:a699:22:0:25:4
            session monitor-enabled
        }
        /Common/MNP-Node-5:5060 {
            address 2405:200:642:a699:22:0:25:5
            session monitor-enabled
        }
    }
}
ltm pool /Common/TEST_POOL-JIO-MNP-BL-SIP-5070-IPv6 {
    monitor /Common/MNP-SIP-Monitor
    members {
        /Common/MNP-Node-1:5070 {
            address 2405:200:642:a699:22:0:25:1
            session monitor-enabled
        }
        /Common/MNP-Node-2:5070 {
            address 2405:200:642:a699:22:0:25:2
            session monitor-enabled
        }
    }
}
ltm pool /Common/WEB-POOL-1 {
    monitor min 1 of {
        /Common/WEB-HTTP-Monitor
    }
    members {
        /Common/WEB-Node-1:80 {
            address 10.20.30.11
            session monitor-enabled
        }
        /Common/WEB-Node-2:80 {
            address 10.20.30.12
            session monitor-enabled
        }
        /Common/10.20.30.99:80 {
            address 10.20.30.99
            session monitor-enabled
        }
    }
}
ltm pool /Common/WEB-POOL-2 {
    monitor /Common/WEB-HTTP-Monitor
    members {
        /Common/WEB-Node-1:8080 {
            address 10.20.30.11
            session monitor-enabled
        }
    }
}

ltm virtual /Common/VS-MNP-BL-SIP-5060-IPv6 {
    description "Migrated MNP SIP VIP"
    destination /Common/2405:200:642:a699::76.5060
    ip-protocol udp
    mask 255.255.255.255
    pool /Common/TEST_POOL-JIO-MNP-BL-SIP-5060-IPv6
    profiles {
        udp { context all }
    }
    vlans {
        /Common/MNP-VLAN-1699
    }
    vlans-enabled
}
ltm virtual /Common/VS-MNP-BL-SIP-5070-IPv6 {
    destination /Common/2405:200:642:a699::77.5070
    ip-protocol udp
    mask 255.255.255.255
    pool /Common/TEST_POOL-JIO-MNP-BL-SIP-5070-IPv6
    profiles {
        udp { context all }
    }
    vlans {
        /Common/MNP-VLAN-1699
    }
    vlans-enabled
}
ltm virtual /Common/VS-MNP-BL-SIP-5061-IPv6-RD {
    destination /Common/2405:200:642:a699::78%10.5061
    ip-protocol udp
    mask 255.255.255.255
    pool /Common/TEST_POOL-JIO-MNP-BL-SIP-5060-IPv6
    profiles {
        udp { context all }
    }
    vlans-disabled
}
ltm virtual /Common/VS-WEB-HTTP-80 {
    destination /Common/10.10.10.10:80
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/WEB-POOL-1
    profiles {
        tcp { context all }
        http { context all }
    }
    persist {
        /Common/cookie { }
    }
    rules {
        /Common/_sys_https_redirect
    }
    source-address-translation {
        type automap
    }
    vlans {
        /Common/WEB-VLAN-200
    }
    vlans-enabled
}
ltm virtual /Common/VS-WEB-HTTP-8080 {
    destination /Common/10.10.10.20:8080
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/WEB-POOL-2
    profiles {
        tcp { context all }
    }
    source-address-translation {
        type automap
    }
    vlans {
        /Common/WEB-VLAN-200
        /Common/EXTERNAL-VLAN-9000
    }
    vlans-enabled
}
ltm virtual /Common/VS-WEB-REJECT {
    destination /Common/10.10.10.30:9999
    ip-protocol tcp
    mask 255.255.255.255
    vlans-disabled
}
