#TMSH-VERSION: 17.1.0
# Demo config used ONLY to generate screenshots for the README/docs.
# Every address is from an RFC-reserved documentation range
# (192.0.2.0/24, 203.0.113.0/24, 2001:db8::/32) and every name is
# generic/fictional -- never used by the pytest suite.

ltm node /Common/node-voice-01 {
    address 2001:db8:1::21:1
    state user-up
}
ltm node /Common/node-voice-02 {
    address 2001:db8:1::21:2
    state user-up
}
ltm node /Common/node-voice-03 {
    address 2001:db8:1::21:3
    state user-up
}
ltm node /Common/node-voice-04 {
    address 2001:db8:1::21:4
    state user-up
}
ltm node /Common/node-voice-05 {
    address 2001:db8:1::21:5
    state user-up
}
ltm node /Common/node-app-01 {
    address 192.0.2.11
    state user-up
}
ltm node /Common/node-app-02 {
    address 192.0.2.12
    state user-up
}

ltm monitor udp /Common/monitor-voice-udp {
    interval 5
    timeout 16
}
ltm monitor http /Common/monitor-app-http {
    interval 5
    timeout 16
}

net vlan /Common/vlan-voice-100 {
    tag 100
    interfaces {
        1.3 { }
    }
}
net vlan /Common/vlan-app-200 {
    tag 200
    interfaces {
        1.1 { }
    }
}

ltm pool /Common/pool-voice-primary {
    monitor /Common/monitor-voice-udp
    members {
        /Common/node-voice-01:5060 {
            address 2001:db8:1::21:1
            session monitor-enabled
        }
        /Common/node-voice-02:5060 {
            address 2001:db8:1::21:2
            session monitor-enabled
        }
        /Common/node-voice-03:5060 {
            address 2001:db8:1::21:3
            session monitor-enabled
        }
        /Common/node-voice-04:5060 {
            address 2001:db8:1::21:4
            session monitor-enabled
        }
        /Common/node-voice-05:5060 {
            address 2001:db8:1::21:5
            session monitor-enabled
        }
    }
}
ltm pool /Common/pool-voice-secondary {
    monitor /Common/monitor-voice-udp
    members {
        /Common/node-voice-01:5070 {
            address 2001:db8:1::21:1
            session monitor-enabled
        }
        /Common/node-voice-02:5070 {
            address 2001:db8:1::21:2
            session monitor-enabled
        }
    }
}
ltm pool /Common/pool-app-01 {
    monitor min 1 of {
        /Common/monitor-app-http
    }
    members {
        /Common/node-app-01:80 {
            address 192.0.2.11
            session monitor-enabled
        }
        /Common/node-app-02:80 {
            address 192.0.2.12
            session monitor-enabled
        }
        /Common/192.0.2.99:80 {
            address 192.0.2.99
            session monitor-enabled
        }
    }
}
ltm pool /Common/pool-app-02 {
    monitor /Common/monitor-app-http
    members {
        /Common/node-app-01:8080 {
            address 192.0.2.11
            session monitor-enabled
        }
    }
}

ltm virtual /Common/vs-voice-primary-ipv6 {
    description "Demo voice VIP"
    destination /Common/2001:db8:1::76.5060
    ip-protocol udp
    mask 255.255.255.255
    pool /Common/pool-voice-primary
    profiles {
        udp { context all }
    }
    vlans {
        /Common/vlan-voice-100
    }
    vlans-enabled
}
ltm virtual /Common/vs-voice-secondary-ipv6 {
    destination /Common/2001:db8:1::77.5070
    ip-protocol udp
    mask 255.255.255.255
    pool /Common/pool-voice-secondary
    profiles {
        udp { context all }
    }
    vlans {
        /Common/vlan-voice-100
    }
    vlans-enabled
}
ltm virtual /Common/vs-voice-primary-rd-ipv6 {
    destination /Common/2001:db8:1::78%10.5061
    ip-protocol udp
    mask 255.255.255.255
    pool /Common/pool-voice-primary
    profiles {
        udp { context all }
    }
    vlans-disabled
}
ltm virtual /Common/vs-app-web-01 {
    destination /Common/203.0.113.10:80
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool-app-01
    profiles {
        tcp { context all }
        http { context all }
    }
    persist {
        /Common/cookie { }
    }
    rules {
        /Common/_sys_https_redirect
    }
    source-address-translation {
        type automap
    }
    vlans {
        /Common/vlan-app-200
    }
    vlans-enabled
}
ltm virtual /Common/vs-app-web-02 {
    destination /Common/203.0.113.20:8080
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool-app-02
    profiles {
        tcp { context all }
    }
    source-address-translation {
        type automap
    }
    vlans {
        /Common/vlan-app-200
        /Common/vlan-external-900
    }
    vlans-enabled
}
ltm virtual /Common/vs-app-maintenance {
    destination /Common/203.0.113.30:9999
    ip-protocol tcp
    mask 255.255.255.255
    vlans-disabled
}
