services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Allow the frontend's own origin through CORS. Not strictly required
      # once nginx is proxying same-origin /api/ (browser never crosses
      # origins), but kept explicit/overridable for setups that expose the
      # backend directly too.
      F5CI_CORS_ORIGINS_RAW: ${F5CI_CORS_ORIGINS_RAW:-http://localhost:8080}
      WEB_CONCURRENCY: ${BACKEND_WORKERS:-4}
    volumes:
      - f5ci-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  f5ci-data:
